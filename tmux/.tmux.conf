# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# Reload tmux configurations
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf configurations reloaded"

bind-key h split-window -v  -c '#{pane_current_path}' # split window in vertical
bind-key v split-window -h  -c '#{pane_current_path}' # split window in horizontal

# Navigate between panes like a boss (similar to vi navigation keys)
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# Windows configurations
bind c new-window -c "#{pane_current_path}" # Open new windows in current path
set -g base-index 1 # Start window numbering at 1
set -g renumber-windows on # Renumber windows as they are created

# Window names — show just the basename of the current path, not the full path
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Resize panes using shift and arrow keys
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# copy to clipboard
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Use colors in the right way
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

#Set the left and right status
set -g status-left ''
set -g status-right '#[fg=colour245] #(cd "#{pane_current_path}" && git branch --show-current 2>/dev/null) #[bg=colour3]#[fg=colour0] %b %d %H:%M '
set -g status-interval 5
set -g status-right-length 100

#Set the background and foreground color
set -g status-bg colour0
set -g status-fg colour3

# Window list styles — dim inactive, highlight active
set -g window-status-style 'fg=colour245'
set -g window-status-current-style 'fg=colour0,bg=colour3,bold'

# Increase history (AI agent output is dense — bump from 10000)
set-option -g history-limit 50000

# Forward focus events to inner programs (Vim FocusGained/Lost, etc.)
set -g focus-events on

# Bell notifications (Claude Code attention alerts)
set-option -g monitor-bell on
set-option -g bell-action other
set-option -g visual-bell on

# Activity monitoring — flag windows where agents produce output
set-option -g monitor-activity on
set-option -g visual-activity off
bind-key ! next-window -a

# Mouse support — click into agent panes, scroll, resize
set -g mouse on

# Zero escape delay — Vim/Neovim responds to Esc instantly
set -sg escape-time 0

# Pane border labels — show command + path per pane (useful for agent teams)
set -g pane-border-status top
set -g pane-border-format ' #{pane_index} · #{pane_current_command} · #{b:pane_current_path} '
set -g pane-border-style 'fg=colour240'
set -g pane-active-border-style 'fg=colour3'

# Popup scratch terminal — prefix + g opens a floating shell
bind-key g display-popup -E -w 80% -h 80% -d '#{pane_current_path}'

# Synchronize panes toggle — prefix + e types to every pane at once
bind-key e set-window-option synchronize-panes \; display-message 'synchronize-panes #{?pane_synchronized,ON,OFF}'

# Status bar on bottom (default)
set -g status-position bottom
