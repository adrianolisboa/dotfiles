# atuin — shell history (managed by macforge). Full options: https://docs.atuin.sh/configuration/config/
#
# One-time on a new machine, import existing shell history (atuin starts empty):
#   atuin import auto

# Search ALL history by default (not just the current shell session).
filter_mode = "global"

# Local-only: no account, no network sync. Run `atuin login` yourself if you ever want sync.
auto_sync = false
update_check = false

# Ctrl-R search UX
search_mode = "fuzzy"
enter_accept = true
